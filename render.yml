# Requires the prepared corpus and matching complete index at the configured paths.
# Provision data storage before startup; serving does not download or index data.
services:
  - type: web
    name: natural-questions-rag-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync python -m app.main server.environment=production
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: OPENROUTER_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: false
